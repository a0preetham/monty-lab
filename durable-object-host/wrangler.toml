name = "monty-agent-runtime"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Durable Objects with SQLite storage: 1 GB per object on the free plan,
# 10 GB on paid. Snapshots here are measured in kilobytes.
[[durable_objects.bindings]]
name = "AGENT_RUN"
class_name = "AgentRun"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentRun"]

[build]
command = ""

# Turnstile. The *site* key is public by design and belongs in config; the
# secret is set with `wrangler secret put TURNSTILE_SECRET` and never lives
# here. With neither set the bot gate is inert, which is how local workerd and
# the integration suite run.
[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAFDqqdyNqiQaevjA"
