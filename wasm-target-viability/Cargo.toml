[package]
name = "monty-wasm-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

# Deliberately NOT a workspace member.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
monty = "0.0.23"
# Must be named explicitly so the `wasm_js` feature is unified into the build;
# monty depends on getrandom 0.3 without it.
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
monty-types = "0.0.23"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
